name: Build

on:
  workflow_call:
    inputs:
      build:
        description: 'Whether to run a plain `alr build`'
        required: false
        default: true
        type: boolean
      crate:
        description: 'The crate to build'
        required: true
        type: string

env:
  AAA_STYLE_CHECKS: enabled
  AAA_RUNTIME_CHECKS: enabled
  AAA_COMPILE_CHECKS: enabled
  AAA_CONTRACTS: enabled

jobs:
  build:
    name: test (${{inputs.crate}}, GNAT ${{ matrix.combo.gnat }}, ${{ matrix.combo.os }})
    strategy:
      fail-fast: false
      matrix:
        combo: # Test an assorment of representative combinations
          - os: ubuntu-24.04-arm
            gnat: # latest
          - os: ubuntu-latest
            gnat: # latest
          - os: macos-15 # Not macos-latest (macos-26): since runner image
                         # 20261013, its SDK's libSystem.tbd lists arm64e.x1,
                         # which the GNAT linker rejects ("unknown
                         # architecture"). Restore once a fixed GNAT is out.
            gnat: # latest
          - os: windows-latest
            gnat: # latest

    runs-on: ${{ matrix.combo.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Alire and toolchain
      uses: alire-project/setup-alire@v6
      with:
        version: nightly # for [test]
        toolchain: gnat_native${{ matrix.combo.gnat }} gprbuild

    - name: Build
      if: ${{inputs.build}}
      run: cd ${{inputs.crate}} && alr -q build

    - name: Run tests
      run: cd ${{inputs.crate}} && alr test
